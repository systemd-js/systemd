name: Publish

# https://dev.to/xcanchal/automatic-versioning-in-a-lerna-monorepo-using-github-actions-4hij
# Problems:
#   I tried to use github registry to publish public packages,
#   but packages in github require auth to install even if package is public.
#
#   Publishing uses npm trusted publishing (OIDC), no NPM_TOKEN secret.
#   Job needs id-token: write, trusted publisher is configured per package on npmjs.com
#   When publishing public package, publishConfig.access need to be configured on each package
#
#   Lerna need fetch-depth: 0 (full fetch) on checkout to be able generate full changelog


on:
  pull_request:
    types: [closed]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Setup NodeJS 24"
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'yarn'

    - name: Install
      run: yarn install
      
    - name: Build
      run: yarn build

    - name: Test
      run: yarn test

    - name: Lint
      run: yarn lint
    
    - name: Setup git user
      run: |
        echo "Setup git user to github action user"
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor}}@users.noreply.github.com"

    - name: "Version and publish"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Version"
        yarn lerna version \
          --conventional-commits \
          --yes
        
        echo "Publish"
        yarn lerna publish from-git \
          --loglevel debug \
          --yes
